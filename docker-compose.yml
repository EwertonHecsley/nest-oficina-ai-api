# docker-compose.yml
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: oficina-ai-db
    environment:
      POSTGRES_USER: oficina
      POSTGRES_PASSWORD: oficina
      POSTGRES_DB: oficina_ai
    ports:
      - "5432:5432"   
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oficina -d oficina_ai"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: